<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Solborne bearing mark, favicon simplification: point over a level line,
       reversed on Ink. Per brand usage rules the point stays Bearing amber
       at every size and the horizon never tilts. -->
  <rect width="64" height="64" rx="12" fill="#211D18"/>
  <circle cx="32" cy="20" r="9" fill="#C1872E"/>
  <line x1="32" y1="29" x2="32" y2="47" stroke="#F1EBDD" stroke-width="4.5"/>
  <line x1="15" y1="47" x2="49" y2="47" stroke="#F1EBDD" stroke-width="4.5"/>
</svg>

