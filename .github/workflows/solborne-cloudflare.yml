name: Solborne Cloudflare source checks
on:
  push:
    paths: ['cloudflare-site/**', '.github/workflows/solborne-cloudflare.yml']
  pull_request:
    paths: ['cloudflare-site/**', '.github/workflows/solborne-cloudflare.yml']
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create isolated synthetic test-only delivery inputs
        run: |
          node --input-type=module -e "import{mkdir,writeFile}from'node:fs/promises';await mkdir('private',{recursive:true});await writeFile('private/canvas.pdf','%PDF-1.4\nSynthetic CI access-control fixture. NEVER DEPLOY.');await writeFile('private/canvas.txt','Synthetic CI access-control fixture. NEVER DEPLOY.');"
      - name: Build isolated test runtime
        run: npm run build
      - name: Run functional, ownership, SEO and consent tests
        run: npm test
